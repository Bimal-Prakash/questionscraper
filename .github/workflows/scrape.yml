# Scheduled harvest.
#
# The GitHub-hosted runner is the free tier's best compute: it starts fast, runs
# for as long as the job needs, and dies afterwards. That fits a polite scraper
# far better than a free web dyno which sleeps after 15 idle minutes mid-loop.
# It writes into the same Neon Postgres the Render API reads from - the two
# never talk to each other, they meet in the database.
#
# Minutes are free and unmetered on public repos. On a PRIVATE repo you get
# 2,000/month; this schedule uses roughly 1,000.
name: scrape

on:
  schedule:
    # 03:23 and 15:23 UTC. Off the hour on purpose: GitHub queues cron jobs and
    # the top of the hour is the most contended slot.
    - cron: "23 3,15 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Stop after this many new questions. Blank = use minutes."
        required: false
        default: ""
      minutes:
        description: "Minutes to keep pulling. Default 20, 2 = smoke test."
        required: false
        default: ""
      seed:
        description: "Import the repo's questions.json first (one-off, for a fresh database)."
        type: boolean
        default: false

# Two harvests at once would walk the same catalogue pages and fight over the
# stored cursor. The unique constraint keeps the data correct either way, but
# the requests would be wasted.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
      ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One-off, on a fresh database: loads the dataset committed to the repo so
      # the API has something to serve before the first harvest finishes.
      # Idempotent - already-stored questions are skipped.
      - name: Seed from questions.json
        if: inputs.seed
        run: python cli.py import-json questions.json

      - name: Harvest questions
        env:
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_MINUTES: ${{ inputs.minutes }}
        run: |
          # Written as `if` blocks, not `[ … ] && …`: the runner uses `bash -e`,
          # where a false test on its own line aborts the step.
          ARGS="--delay 0.8"
          if [ -n "$INPUT_COUNT" ]; then ARGS="$ARGS --count $INPUT_COUNT"; fi
          if [ -n "$INPUT_MINUTES" ]; then
            ARGS="$ARGS --minutes $INPUT_MINUTES"
          elif [ -z "$INPUT_COUNT" ]; then
            # Default budget. Well inside the job timeout, so the summary step
            # below always runs and the catalogue cursor is always persisted.
            ARGS="$ARGS --minutes 20"
          fi
          python cli.py extract $ARGS

      # Fails the job when the database is empty, so a run that scraped nothing
      # is not reported as a success.
      - name: Show database totals
        if: always()
        run: python cli.py stats
